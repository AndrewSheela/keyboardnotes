<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-Digit Password Generator</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .password-display {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: var(--primary-color);
            background-color: #f8fafc;
            border: 2px dashed var(--border-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            user-select: all;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .toast {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #10b981;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Password Generator</h2>
        <div id="passwordDisplay" class="password-display">------</div>
        <button class="btn" id="generateBtn">Generate Password</button>
        <div id="toast" class="toast">Password copied to clipboard!</div>
    </div>

    <script>
        const passwordDisplay = document.getElementById('passwordDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const toast = document.getElementById('toast');

        function generatePassword() {
            // Generates a random number between 000000 and 999999 and pads with leading zeros if necessary
            const randomPassword = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
            
            passwordDisplay.textContent = randomPassword;

            // Optional: Automatically copy the new password to the clipboard
            navigator.clipboard.writeText(randomPassword).then(() => {
                showToast();
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // Generate a password on initial page load
        window.onload = generatePassword;

        // Generate a new password whenever the button is clicked
        generateBtn.addEventListener('click', generatePassword);
    </script>

</body>
</html>
